<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Marketplace Funnel - Leads</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:    #0d1117;
            --bg-card:    #161b22;
            --bg-card2:   #1c2333;
            --border:     rgba(255,255,255,0.08);
            --text-pri:   #e6edf3;
            --text-sec:   #8b949e;
            --accent:     #3b82f6;
            --accent-g:   #10b981;
            --accent-r:   #ef4444;
            --accent-y:   #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-pri);
            min-height: 100vh;
        }
        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        /* ── Header ── */
        .crm-header {
            background: rgba(22,27,34,0.95);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 50;
        }

        /* ── Stat cards ── */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }
        .stat-label { font-size: 11px; color: var(--text-sec); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 700; color: var(--text-pri); }

        /* ── Filter bar ── */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }
        .tab-btn {
            padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
            color: var(--text-sec); border: 1px solid transparent;
            cursor: pointer; transition: all .15s; white-space: nowrap;
            background: transparent;
        }
        .tab-btn.active, .tab-btn:hover {
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
            border-color: rgba(59,130,246,0.3);
        }
        .crm-select, .crm-input {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-pri);
            font-size: 13px;
            padding: 7px 10px;
            min-width: 130px;
        }
        .crm-select:focus, .crm-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        option { background: #1c2333; }

        /* ── Lead cards ── */
        .lead-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }
        .lead-card:hover {
            border-color: rgba(59,130,246,0.4);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }
        .lead-card.ignored { opacity: 0.45; }
        .card-footer {
            background: rgba(255,255,255,0.03);
            border-top: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }

        /* ── Buttons ── */
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, opacity .15s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: var(--accent-g); }
        .btn-success:hover { background: #059669; }
        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text-pri);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }

        /* ── Status badges ── */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
            border: 1px solid;
        }
        .badge-new    { background: rgba(59,130,246,0.15); color: #60a5fa; border-color: rgba(59,130,246,0.3); }
        .badge-ok     { background: rgba(16,185,129,0.15); color: #34d399; border-color: rgba(16,185,129,0.3); }
        .badge-ignored{ background: rgba(239,68,68,0.12);  color: #f87171; border-color: rgba(239,68,68,0.25); }
        .badge-score  { background: rgba(245,158,11,0.15); color: #fbbf24; border-color: rgba(245,158,11,0.3); }
        .badge-timer  { background: rgba(99,102,241,0.15); color: #a5b4fc; border-color: rgba(99,102,241,0.3); }
        .badge-expired{ background: rgba(239,68,68,0.15);  color: #f87171; border-color: rgba(239,68,68,0.3); }

        /* ── Valuation box ── */
        .valuation-box {
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.2);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }
        .valuation-box .msg-area {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-sec);
            font-size: 12px;
            padding: 8px 10px;
            resize: none;
            width: 100%;
            height: 9rem;
            line-height: 1.5;
        }
        .valuation-box .msg-area:focus { outline: none; border-color: var(--accent); }

        /* ── Progress banners ── */
        .progress-banner {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            padding: 12px 24px;
            display: none;
        }
        .progress-banner.show { display: block; }

        /* ── Dropdown menu ── */
        .dropdown-menu {
            display: none;
            position: absolute; right: 0; bottom: 100%; margin-bottom: 6px;
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            min-width: 150px;
            z-index: 20;
        }
        .dropdown-wrap:hover .dropdown-menu { display: block; }
        .dropdown-item {
            display: block; width: 100%;
            text-align: left;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--text-sec);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background .12s, color .12s;
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.06); color: var(--text-pri); }

        /* ── Empty state ── */
        .empty-state { color: var(--text-sec); }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="crm-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <h1 class="text-[16px] font-bold text-white tracking-tight flex items-center gap-2">
                🚗 <span>FB Funnel Dashboard</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="startScrape()" class="btn-primary">
                    <span>🚀</span> Scrape Now
                </button>
                <button onclick="startMessaging()" class="btn-primary btn-success">
                    <span>💬</span> Send Messages
                </button>
                <span id="total-leads"
                    class="badge badge-new text-xs px-3 py-1">...</span>
                <button onclick="loadLeads()" title="Refresh" class="btn-ghost px-2 py-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Scrape Progress Banner -->
    <div id="scrape-banner" class="hidden fixed top-0 left-0 right-0 z-[999] text-white px-6 py-3 shadow-xl" style="background:rgba(30,27,75,0.97);border-bottom:1px solid rgba(99,102,241,0.4);">
        <div class="max-w-7xl mx-auto flex items-center gap-4">
            <div class="text-lg">🚀</div>
            <div class="flex-1">
                <div class="flex justify-between items-center mb-1">
                    <span id="scrape-log" class="text-sm font-medium truncate max-w-xl text-slate-200">Iniciando...</span>
                    <span id="scrape-pct" class="text-sm font-bold ml-4 text-indigo-300">0%</span>
                </div>
                <div class="w-full rounded-full h-1.5" style="background:rgba(99,102,241,0.25);">
                    <div id="scrape-bar" class="h-1.5 rounded-full transition-all duration-500" style="width:0%;background:#34d399;"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-400 mt-1">
                    <span id="scrape-vehicles"></span>
                    <span>Scraping Facebook Marketplace...</span>
                </div>
            </div>
            <button onclick="document.getElementById('scrape-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xl ml-2">&times;</button>
        </div>
    </div>

    <!-- Messaging Progress Banner -->
    <div id="msg-banner" class="hidden fixed top-0 left-0 right-0 z-[999] text-white px-6 py-3 shadow-xl" style="background:rgba(6,46,30,0.97);border-bottom:1px solid rgba(16,185,129,0.4);">
        <div class="max-w-7xl mx-auto flex items-center gap-4">
            <div class="text-lg">💬</div>
            <div class="flex-1">
                <div class="flex justify-between items-center mb-1">
                    <span id="msg-log" class="text-sm font-medium truncate max-w-xl text-slate-200">Iniciando mensajes...</span>
                    <span id="msg-pct" class="text-sm font-bold ml-4 text-emerald-300">0%</span>
                </div>
                <div class="w-full rounded-full h-1.5" style="background:rgba(16,185,129,0.2);">
                    <div id="msg-bar" class="h-1.5 rounded-full transition-all duration-500" style="width:0%;background:#fbbf24;"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-400 mt-1">
                    <span id="msg-sent"></span>
                    <span>Enviando mensajes · 5–8 min entre cada uno</span>
                </div>
            </div>
            <button onclick="document.getElementById('msg-banner').classList.add('hidden')" class="text-slate-400 hover:text-white text-xl ml-2">&times;</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Summary Stats -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <div class="stat-label">Total Autos</div>
                <div id="summary-total-autos" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Comisiones (Mes)</div>
                <div id="summary-comisiones-mes" class="stat-value" style="color:#34d399;">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Ventas Totales</div>
                <div id="summary-ventas-totales" class="stat-value">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Comisiones a Recibir</div>
                <div id="summary-comisiones-recibir" class="stat-value" style="color:#60a5fa;">$0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar mb-6">
            <div class="flex flex-wrap gap-3 items-end">

                <!-- Tabs -->
                <div class="flex gap-1 mb-3 w-full overflow-x-auto pb-1" style="border-bottom:1px solid var(--border);">
                    <button onclick="switchTab('new')" id="tab-new" class="tab-btn active">Nuevos</button>
                    <button onclick="switchTab('contacted')" id="tab-contacted" class="tab-btn">Contactados</button>
                    <button onclick="switchTab('ignored')" id="tab-ignored" class="tab-btn">Ignorados</button>
                    <button onclick="switchTab('outside')" id="tab-outside" class="tab-btn">Fuera de Región</button>
                    <button onclick="switchTab('all')" id="tab-all" class="tab-btn">Todos</button>
                </div>
                <input type="hidden" id="status-filter" value="new">

                <!-- Brand -->
                <div class="flex flex-col gap-1">
                    <label class="stat-label">Marca</label>
                    <select id="brand-filter" onchange="onBrandChange()" class="crm-select">
                        <option value="">Todas las marcas</option>
                    </select>
                </div>

                <!-- Model -->
                <div class="flex flex-col gap-1">
                    <label class="stat-label">Modelo</label>
                    <select id="model-filter" onchange="renderLeads()" class="crm-select">
                        <option value="">Todos los modelos</option>
                    </select>
                </div>

                <!-- Min Price -->
                <div class="flex flex-col gap-1">
                    <label class="stat-label">Precio mín (CLP)</label>
                    <input type="number" id="price-min" placeholder="0" step="100000" min="0" oninput="renderLeads()"
                        class="crm-input w-36">
                </div>

                <!-- Max Price -->
                <div class="flex flex-col gap-1">
                    <label class="stat-label">Precio máx (CLP)</label>
                    <input type="number" id="price-max" placeholder="Sin límite" step="100000" min="0" oninput="renderLeads()"
                        class="crm-input w-36">
                </div>

                <!-- Min Year -->
                <div class="flex flex-col gap-1">
                    <label class="stat-label">Año mín</label>
                    <select id="year-filter" onchange="renderLeads()" class="crm-select">
                        <option value="0">Cualquiera</option>
                        <option value="2000">2000+</option>
                        <option value="2005">2005+</option>
                        <option value="2010">2010+</option>
                        <option value="2015">2015+</option>
                        <option value="2018">2018+</option>
                        <option value="2020">2020+</option>
                    </select>
                </div>

                <!-- Reset -->
                <div class="flex flex-col gap-1 justify-end">
                    <button onclick="resetFilters()" class="btn-ghost text-sm">✕ Limpiar</button>
                </div>

                <span class="flex-grow"></span>
                <div id="filter-stats" class="text-xs pb-1" style="color:var(--text-sec);align-self:flex-end;"></div>
            </div>
        </div>

        <!-- Grid -->
        <div id="leads-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <!-- Cards injected via JS -->
        </div>

    </main>

    <script>
        // ── Base path helper (works under /funnels or standalone) ────────
        const BASE = location.pathname.replace(/\/+$/, '');
        function apiUrl(path) { return BASE + path; }

        let allLeads = [];

        // ── Parse brand & model from title ──────────────────────────────
        function parseBrandModel(title) {
            const parts = title.trim().split(/\s+/);
            const start = (parts[0] && /^\d{4}$/.test(parts[0])) ? 1 : 0;
            const brand = (parts[start] || '').toLowerCase();
            const model = parts.slice(start + 1).join(' ').toLowerCase() || '';
            return { brand, model };
        }

        // ── Populate brand dropdown from data ───────────────────────────
        function populateBrandFilter() {
            const brands = [...new Set(
                allLeads.map(l => parseBrandModel(l.title).brand)
                    .filter(Boolean)
            )].sort();

            const sel = document.getElementById('brand-filter');
            sel.innerHTML = '<option value="">Todas las marcas</option>';
            brands.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                sel.appendChild(opt);
            });
        }

        // ── When brand changes, repopulate model dropdown ────────────────
        function onBrandChange() {
            const brand = document.getElementById('brand-filter').value;
            const modelSel = document.getElementById('model-filter');
            modelSel.innerHTML = '<option value="">Todos los modelos</option>';

            if (brand) {
                const models = [...new Set(
                    allLeads
                        .filter(l => parseBrandModel(l.title).brand === brand)
                        .map(l => parseBrandModel(l.title).model)
                        .filter(Boolean)
                )].sort();

                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m;
                    opt.textContent = m;
                    modelSel.appendChild(opt);
                });
            }
            renderLeads();
        }

        function parsePrice(priceStr) {
            if (!priceStr || priceStr === 'N/A') return null;
            const digits = String(priceStr).replace(/[^\d]/g, '');
            return digits ? parseInt(digits, 10) : null;
        }

        // ── Helper: Copy to clipboard ────────────────────────────────────
        function copyMessage(btn, url) {
            const textarea = btn.previousElementSibling;
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = '✅';
                setTimeout(() => btn.innerHTML = orig, 1500);
            });
        }

        // ── Render Valuation Results Box ────────────────────────────────
        function renderValuationBox(pricing, lead) {
            const fmt = n => 'CLP ' + n.toLocaleString('es-CL');
            const market = pricing.market_price;
            const consignacion = pricing.consignment_liquidation;
            const compra = pricing.immediate_offer;
            const { brand, model } = parseBrandModel(lead.title);

            return `
                <div class="valuation-box">
                    <div class="mb-2">
                        <span style="font-size:10px;color:#a78bfa;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Valor Mercado Real (IA)</span>
                        <p style="font-size:18px;font-weight:700;color:#e6edf3;">${fmt(market)}</p>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;">
                        <div style="display:flex;justify-content:space-between;font-size:12px;">
                            <span style="color:#8b949e;">🤝 Consignación Real</span>
                            <span style="font-weight:700;color:#34d399;">${fmt(consignacion)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:12px;">
                            <span style="color:#8b949e;">⚡ Compra inmediata</span>
                            <span style="font-weight:700;color:#fbbf24;">${fmt(compra)}</span>
                        </div>
                    </div>
                    <div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;">
                        <label style="display:block;font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;margin-bottom:6px;">💬 Mensaje sugerido</label>
                        <div style="display:flex;gap:8px;">
                            <textarea readonly class="msg-area">Hola ${lead.seller ? lead.seller.split(' ')[0] : 'Amigo'}, vi tu ${brand.toUpperCase()} ${model.toUpperCase()} ${lead.year} publicado.

Nuestra tecnología analizó el mercado y estima que podríamos gestionar la venta asegurándote ${fmt(consignacion)} líquidos para tu bolsillo.

Así tú obtienes el monto que buscas sin tener que lidiar con extraños ni trámites.

¿Te hace sentido esa cifra para conversar?

Quedo atento,
Felipe Yanez
Agente de Ventas | Autodirecto.cl</textarea>
                            <button onclick="copyMessage(this, '${lead.url}')"
                                style="background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#a5b4fc;border-radius:8px;padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-width:44px;"
                                title="Copiar">
                                <span style="font-size:18px;">📋</span>
                                <span style="font-size:10px;font-weight:700;">Copiar</span>
                            </button>
                        </div>
                    </div>
                </div>
             `;
        }

        // ── Get Real Valuation from API ──────────────────────────────────
        async function getValuation(btn, url, make, model, year, mileage) {
            const originalText = btn.innerHTML;

            // UI Loading state
            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span> Tasando...';
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            btn.classList.add('bg-gray-400');

            try {
                const response = await fetch(apiUrl('/api/valuation'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ make, model, year, mileage })
                });
                const data = await response.json();

                if (data.success) {
                    // Save result to backend and refresh UI
                    updateLead(url, { valuation: data.pricing });
                } else {
                    throw new Error(data.error || 'Error en tasación');
                }
            } catch (e) {
                console.error(e);
                btn.innerHTML = '❌ Error';
                btn.classList.add('bg-red-500');
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-red-500', 'bg-gray-400');
                    btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                }, 3000);
            }
        }

        // ── Reset all filters ────────────────────────────────────────────
        function resetFilters() {
            document.getElementById('status-filter').value = 'all';
            document.getElementById('brand-filter').value = '';
            document.getElementById('model-filter').innerHTML = '<option value="">Todos los modelos</option>';
            document.getElementById('price-min').value = '';
            document.getElementById('price-max').value = '';
            document.getElementById('year-filter').value = '0';
            switchTab('new');
        }

        // ── Switch Tabs ────────────────────────────────────────────────
        function switchTab(status) {
            document.getElementById('status-filter').value = status;
            ['new', 'contacted', 'ignored', 'outside', 'all'].forEach(s => {
                const btn = document.getElementById('tab-' + s);
                if (s === status) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderLeads();
        }

        // ── Main render ──────────────────────────────────────────────────
        function renderLeads() {
            const grid = document.getElementById('leads-grid');
            const statusFilter = document.getElementById('status-filter').value;
            const brandFilter = document.getElementById('brand-filter').value.toLowerCase();
            const modelFilter = document.getElementById('model-filter').value.toLowerCase();
            const priceMin = parseInt(document.getElementById('price-min').value) || 0;
            const priceMax = parseInt(document.getElementById('price-max').value) || Infinity;
            const yearFilter = parseInt(document.getElementById('year-filter').value) || 0;

            const filtered = allLeads.filter(lead => {
                // Status & Region Logic
                const status = lead.status || 'new';
                
                if (statusFilter === 'outside') {
                    if (lead.is_v_region) return false;
                } else if (statusFilter !== 'all') {
                    // Regular tabs (Nuevos, Contactados, Ignorados) only show V Region cars
                    if (!lead.is_v_region) return false;
                    if (status !== statusFilter) return false;
                }
                
                // Year
                if (yearFilter && lead.year && parseInt(lead.year) < yearFilter) return false;
                // Brand / Model
                const { brand, model } = parseBrandModel(lead.title);
                if (brandFilter && brand !== brandFilter) return false;
                if (modelFilter && !model.startsWith(modelFilter)) return false;
                // Price
                const price = parsePrice(lead.price);
                if (price !== null) {
                    if (priceMin && price < priceMin) return false;
                    if (priceMax < Infinity && price > priceMax) return false;
                }
                return true;
            });

            document.getElementById('filter-stats').innerText =
                `Mostrando ${filtered.length} de ${allLeads.length}`;
            document.getElementById('total-leads').innerText = `${filtered.length} / ${allLeads.length} Leads`;
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 empty-state text-lg">Sin resultados para estos filtros</div>';
                return;
            }

            filtered.forEach(lead => {
                const card = document.createElement('div');
                card.className = 'lead-card' + (lead.status === 'ignored' ? ' ignored' : '');

                let priceStr = lead.price || 'N/A';
                if (priceStr.startsWith("CLP")) {
                    const priceNum = parsePrice(priceStr);
                    if (priceNum) priceStr = "CLP " + priceNum.toLocaleString('es-CL');
                }
                const price = priceStr;

                const { brand, model } = parseBrandModel(lead.title);
                const year = lead.year || 2020;
                const mileage = lead.mileage || "0";

                let statusBadge = `<span class="badge badge-new">${lead.status || 'new'}</span>`;
                let timerHtml = '';

                if (lead.status === 'contacted') {
                    statusBadge = `<span class="badge badge-ok">contactado</span>`;
                    if (lead.contacted_at) {
                        const now = Math.floor(Date.now() / 1000);
                        const deadline = lead.contacted_at + (72 * 3600);
                        const remaining = deadline - now;
                        if (remaining > 0) {
                            const h = Math.floor(remaining / 3600);
                            const m = Math.floor((remaining % 3600) / 60);
                            timerHtml = `<span class="badge badge-timer">⏳ ${h}h ${m}m</span>`;
                        } else {
                            timerHtml = `<span class="badge badge-expired">⚠️ Expirado</span>`;
                        }
                    }
                }
                if (lead.status === 'ignored') statusBadge = `<span class="badge badge-ignored">ignorado</span>`;

                const photoHtml = lead.photo_url
                    ? `<img src="${lead.photo_url}" alt="${lead.title}" style="width:100%;height:176px;object-fit:cover;background:#1c2333;" onerror="this.onerror=null;this.src='https://placehold.co/400x176/1c2333/8b949e?text=Sin+Foto';">`
                    : `<div style="width:100%;height:176px;background:#1c2333;display:flex;align-items:center;justify-content:center;font-size:48px;">🚗</div>`;

                let valuationContent = '';
                if (lead.valuation) {
                    valuationContent = renderValuationBox(lead.valuation, lead);
                } else {
                    valuationContent = `
                        <button onclick="getValuation(this, '${lead.url}', '${brand}', '${model}', '${year}', '${mileage}')"
                            class="btn-primary" style="width:100%;justify-content:center;margin-bottom:8px;">
                            <span>📊</span> Tasar con IA
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div style="position:relative;">
                        ${photoHtml}
                        ${lead.is_sold ? `<span class="badge badge-ignored" style="position:absolute;top:8px;left:8px;">VENDIDO</span>` : ''}
                        <div style="position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                            <span class="badge badge-score">🔥 ${lead.score || 0}/100</span>
                            ${statusBadge}
                            ${timerHtml}
                        </div>
                    </div>
                    <div style="padding:14px;flex:1;">
                        <h3 style="font-size:14px;font-weight:700;color:#e6edf3;margin-bottom:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;" title="${lead.title}">${lead.title}</h3>
                        <div style="margin-bottom:10px;">
                            <span style="font-size:10px;color:#8b949e;text-transform:uppercase;font-weight:600;letter-spacing:.05em;">Precio pedido</span>
                            <p style="font-size:20px;font-weight:700;color:#60a5fa;margin:0;">${price}</p>
                        </div>
                        ${valuationContent}
                        <div style="border-top:1px solid rgba(255,255,255,0.07);margin:10px 0;"></div>
                        <div style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:#8b949e;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span>📍</span> ${lead.location || 'N/A'}
                                ${lead.is_v_region && lead.distance_to_vina !== undefined && lead.distance_to_vina !== 9999
                                    ? `<span class="badge badge-new" style="font-size:10px;">${lead.distance_to_vina}km a Viña</span>` : ''}
                            </div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span>📅</span> ${lead.year || '----'}
                                ${lead.mileage ? `<span style="color:#6b7280;">• ${lead.mileage}</span>` : ''}
                            </div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span>👤</span> ${lead.seller || 'Desconocido'}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="${lead.url}" target="_blank" rel="noopener noreferrer"
                           class="btn-primary" style="flex:1;justify-content:center;">
                            Ver en FB
                        </a>
                        <div class="dropdown-wrap" style="position:relative;display:inline-block;">
                            <button class="btn-ghost" style="padding:7px 10px;font-size:18px;line-height:1;">⋮</button>
                            <div class="dropdown-menu">
                                <button onclick="updateLead('${lead.url}', {status: 'contacted'})" class="dropdown-item">✅ Contactado</button>
                                <button onclick="updateLead('${lead.url}', {status: 'ignored'})"   class="dropdown-item">🚫 Ignorar</button>
                                <button onclick="updateLead('${lead.url}', {status: 'new'})"       class="dropdown-item">🔄 Resetear</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ── Load data from API ───────────────────────────────────────────
        async function loadLeads() {
            const grid = document.getElementById('leads-grid');
            grid.innerHTML = '<div class="col-span-full text-center py-12 empty-state">Cargando autos...</div>';

            try {
                const response = await fetch(apiUrl('/api/leads'));
                allLeads = await response.json();
                populateBrandFilter();
                renderLeads();
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<div class="col-span-full text-center py-12" style="color:#f87171;">Error cargando datos. Revisa la consola.</div>';
            }
        }

        // ── Update lead status/valuation ─────────────────────────────────
        async function updateLead(url, changes) {
            try {
                const payload = { url, ...changes };
                await fetch(apiUrl('/api/leads/status'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const lead = allLeads.find(l => l.url === url);
                if (lead) {
                    if (changes.status) {
                        lead.status = changes.status;
                        if (changes.status === 'contacted') {
                            lead.contacted_at = Math.floor(Date.now() / 1000);
                        }
                    }
                    if (changes.valuation) {
                        lead.valuation = changes.valuation;
                    }
                }
                renderLeads();
            } catch (err) {
                alert('Error al actualizar lead');
            }
        }

        // ── Trigger scrape via SSE ───────────────────────────────────────
        function startScrape() {
            const banner   = document.getElementById('scrape-banner');
            const bar      = document.getElementById('scrape-bar');
            const pctEl    = document.getElementById('scrape-pct');
            const logEl    = document.getElementById('scrape-log');
            const vehEl    = document.getElementById('scrape-vehicles');

            // Show banner
            banner.classList.remove('hidden');
            bar.style.width = '0%';
            pctEl.textContent = '0%';
            logEl.textContent = 'Iniciando scraper...';
            vehEl.textContent = '';

            const evtSource = new EventSource(apiUrl('/api/scrape'));

            evtSource.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }

                const pct = msg.pct || 0;
                bar.style.width = pct + '%';
                pctEl.textContent = pct + '%';
                if (msg.log) logEl.textContent = msg.log;
                if (msg.vehicles) vehEl.textContent = `${msg.vehicles} vehículos encontrados`;

                if (msg.done) {
                    evtSource.close();
                    bar.classList.remove('bg-green-400');
                    bar.classList.add(msg.success ? 'bg-blue-400' : 'bg-red-400');
                    // Reload leads after short delay
                    setTimeout(() => {
                        loadLeads();
                        setTimeout(() => banner.classList.add('hidden'), 4000);
                    }, 1500);
                }
            };

            evtSource.onerror = () => {
                evtSource.close();
                logEl.textContent = '❌ Connection lost or scraper exited.';
                bar.classList.add('bg-red-400');
            };
        }

        // ── Trigger auto-messenger via SSE ───────────────────────────────
        function startMessaging() {
            const limit = prompt('¿Cuántos mensajes enviar? (máx recomendado: 50)', '10');
            if (!limit || isNaN(limit)) return;
            
            const banner = document.getElementById('msg-banner');
            const bar    = document.getElementById('msg-bar');
            const pctEl  = document.getElementById('msg-pct');
            const logEl  = document.getElementById('msg-log');
            const sentEl = document.getElementById('msg-sent');

            banner.classList.remove('hidden');
            bar.style.width = '0%';
            pctEl.textContent = '0%';
            logEl.textContent = 'Iniciando auto-messenger...';
            sentEl.textContent = '';

            const evtSource = new EventSource(apiUrl(`/api/auto_message?limit=${limit}`));

            evtSource.onmessage = (e) => {
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }

                const pct = msg.pct || 0;
                bar.style.width = pct + '%';
                pctEl.textContent = pct + '%';
                if (msg.log) logEl.textContent = msg.log;
                if (msg.sent !== undefined) sentEl.textContent = `${msg.sent} mensaje(s) enviado(s)`;

                if (msg.done) {
                    evtSource.close();
                    bar.classList.remove('bg-yellow-400');
                    bar.classList.add(msg.success ? 'bg-blue-400' : 'bg-red-400');
                    setTimeout(() => {
                        loadLeads();
                        setTimeout(() => banner.classList.add('hidden'), 5000);
                    }, 2000);
                }
            };

            evtSource.onerror = () => {
                evtSource.close();
                logEl.textContent = '❌ Connection lost or messenger exited.';
                bar.classList.add('bg-red-400');
            };
        }

        // Init
        loadLeads();
    </script>
</body>

</html>
